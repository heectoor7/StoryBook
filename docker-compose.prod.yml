services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storybook_app_prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      INIT_DB_WITH_SEED: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-storybook}
      DB_USERNAME: ${DB_USERNAME:-storybook}
      DB_PASSWORD: ${DB_PASSWORD:-storybook}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: mysql:8.0
    container_name: storybook_db_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-storybook}
      MYSQL_USER: ${DB_USERNAME:-storybook}
      MYSQL_PASSWORD: ${DB_PASSWORD:-storybook}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_this_root_password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-storybook}", "-p${DB_PASSWORD:-storybook}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_storage:
