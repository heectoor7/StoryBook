<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/responsive/auth-shared-responsive.css">
    <link rel="stylesheet" href="css/theme.css">
    <title>Reset Password</title>
</head>

<body>
    <header class="header d-flex justify-content-between align-items-center p-3">
        <a href="index.html"><img src="assets/img/storybookLOGO.png" alt="logo"></a>
        <div class="d-flex align-items-center">
            <button id="themeToggle" class="btn btn-outline-primary me-2 theme-toggle" type="button" aria-label="Toggle theme">Theme</button>
            <a href="login.html" class="btn btn-outline-primary me-2">Back to Login</a>
        </div>
    </header>

    <main class="main">
        <div class="container" style="max-width: 560px; margin-top: 60px;">
            <form id="resetPasswordForm" class="p-4 rounded" style="border: 1px solid #ddd;">
                <h4 class="mb-3 text-center">Set New Password</h4>
                <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="New Password" required>
                <input type="password" name="password_confirmation" class="form-control mb-3" placeholder="Confirm Password" required>
                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                <div id="message" class="mt-3 text-center"></div>
            </form>
        </div>
    </main>

    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/theme-toggle.js"></script>
    <script>
        const form = document.getElementById('resetPasswordForm');
        const message = document.getElementById('message');

        const pathParts = window.location.pathname.split('/');
        const token = pathParts[pathParts.length - 1];
        const emailParam = new URLSearchParams(window.location.search).get('email');

        if (emailParam) {
            form.email.value = emailParam;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.innerText = '';

            const data = Object.fromEntries(new FormData(form).entries());
            data.token = token;

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const json = await res.json();
                message.innerText = json.message || 'Request processed.';

                if (res.ok) {
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                }
            } catch (error) {
                message.innerText = 'Error resetting password.';
                console.error(error);
            }
        });
    </script>
</body>

</html>
