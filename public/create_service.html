<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/responsive/basic-shared-responsive.css">
    <title>Create Service</title>
</head>
<body>
<h2>Create Service</h2>
<form id="serviceForm">
    <input type="text" name="name" placeholder="Service name" required><br>
    <textarea name="description" placeholder="Description"></textarea><br>
    <input type="number" step="0.01" name="price" placeholder="Price" required><br>
    <input type="number" name="category_id" placeholder="Category ID" required><br>
    <button type="submit">Create</button>
</form>

<div id="message"></div>

<script>
const form = document.getElementById('serviceForm');
form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const token = localStorage.getItem('token'); // Suponiendo login ya guarda token
    const formData = Object.fromEntries(new FormData(form).entries());

    try {
        const res = await fetch('/api/services', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(formData)
        });

        const json = await res.json();
        document.getElementById('message').innerText = json.message;
        console.log(json.service);

    } catch (err) {
        document.getElementById('message').innerText = 'Error creating service';
        console.error(err);
    }
});
</script>
</body>
</html>
