<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryBook - Company Panel</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/company/company-style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <img id="sidebarLogo" src="assets/img/storybookLOGO.png" alt="Logo">
        <ul id="sidebarMenu">
            <li id="menuPosts">📝 Posts</li>
            <li id="menuServices">🛠️ Services</li>
            <li id="menuBookings">📅 Bookings</li>
            <li id="menuFollowers">👥 Followers</li>
        </ul>
        <button id="themeToggle" class="btn btn-outline-primary theme-toggle sidebar-theme-toggle" type="button" aria-label="Toggle theme">Theme</button>
    </aside>

    <!-- Main Container -->
    <div class="main-container" id="mainContainer">

        <!-- Header -->
        <header class="header" id="mainHeader">
            <h5 id="sidebarTitle">My Company</h5>
            <div class="d-flex align-items-center gap-2" id="headerActions">
            <button id="companyMenuToggle" class="btn btn-outline-primary company-hamburger-btn" type="button" aria-label="Toggle menu" aria-expanded="false">☰ Menu</button>
            <button id="btnProfile" class="btn btn-outline-primary me-2">My Profile</button>
            <button id="logoutBtn" class="btn btn-outline-danger">Log out</button>
            </div>
        </header>

        <!-- Contenido principal -->
        <main class="content" id="mainContent">

            <!-- Posts Section -->
            <section id="postsSection">
                <div class="section-header">
                    <h5>My Posts</h5>
                    <button class="btn btn-primary" id="btnNewPost">
                        + New Post
                    </button>
                </div>
                <div class="row" id="companyPostsContainer">
                    <p style="color: var(--text-secondary);">Loading posts...</p>
                </div>
            </section>

            <!-- Services Section -->
            <section id="servicesSection" style="display: none;">
                <div class="section-header">
                    <h5>My Services</h5>
                    <button class="btn btn-primary" id="btnNewService">
                        + New Service
                    </button>
                </div>
                <div class="row" id="companyServicesContainer">
                    <p style="color: var(--text-secondary);">Loading services...</p>
                </div>
            </section>

            <!-- Bookings Section -->
            <section id="bookingsSection" style="display: none;">
                <div class="section-header">
                    <h5>Reservations Schedule</h5>
                </div>
                <div id="companyBookingsContainer">
                    <p style="color: var(--text-secondary);">Loading bookings...</p>
                </div>
            </section>

            <!-- Followers Section -->
            <section id="followersSection" style="display: none;">
                <div class="section-header">
                    <h5>My Followers</h5>
                </div>
                <div id="companyFollowersContainer" class="row">
                    <p style="color: var(--text-secondary);">This feature will be available soon.</p>
                </div>
            </section>

        </main>

    </div>

    <!-- New Post Modal -->
    <div class="modal fade" id="newPostModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Post</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="newPostContent" class="form-label">Content</label>
                        <textarea class="form-control" id="newPostContent" rows="4" placeholder="Write something..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="newPostImage" class="form-label">Image (optional)</label>
                        <input type="file" class="form-control" id="newPostImage" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-info" id="btnCreateStory">Publish as Story</button>
                    <button type="button" class="btn btn-primary" id="btnCreatePost">Publish as Post</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Service Modal -->
    <div class="modal fade" id="serviceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="serviceModalTitle">Create Service</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="serviceName" class="form-label">Service name *</label>
                        <input type="text" class="form-control" id="serviceName" required>
                    </div>
                    <div class="mb-3">
                        <label for="serviceDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="serviceDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="servicePrice" class="form-label">Price *</label>
                        <input type="number" step="0.01" class="form-control" id="servicePrice" required>
                    </div>
                    <div class="mb-3">
                        <label for="serviceCategory" class="form-label">Category</label>
                        <input type="text" class="form-control" id="serviceCategory">
                    </div>
                    <div class="mb-3">
                        <label for="serviceImage" class="form-label">Image (optional)</label>
                        <input type="file" class="form-control" id="serviceImage" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btnSaveService">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/bootstrap.bundle.js"></script>
    <!-- Módulos de funcionalidad -->
    <script src="js/company/company-posts.js"></script>
    <script src="js/company/company-services.js"></script>
    <script src="js/company/company-bookings.js"></script>
    <script src="js/company/company-followers.js"></script>
    <!-- Navegación -->
    <script src="js/company/company-navigation.js"></script>
    <script src="js/theme-toggle.js"></script>
</body>

</html>
