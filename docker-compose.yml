services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storybook_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      INIT_DB_WITH_SEED: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: storybook
      DB_USERNAME: storybook
      DB_PASSWORD: storybook
      CACHE_STORE: database
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: mysql:8.0
    container_name: storybook_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: storybook
      MYSQL_USER: storybook
      MYSQL_PASSWORD: storybook
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ustorybook", "-pstorybook"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_storage:
